<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HAILIFU | Page Not Found</title>

    <style media="screen">
      :root {
        --hailifu-black: #000000;
        --hailifu-orange: #FF8C00;
        --hailifu-white: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: radial-gradient(circle at 16% 10%, rgba(255, 140, 0, 0.14), transparent 42%), var(--hailifu-black);
        color: var(--hailifu-white);
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(90deg, rgba(255, 140, 0, 0.03) 0 1px, transparent 1px 4px);
        opacity: 0.55;
        pointer-events: none;
      }
      #message {
        width: min(560px, 100%);
        background: rgba(0, 0, 0, 0.92);
        border: 1px solid var(--hailifu-orange);
        border-radius: 14px;
        padding: 28px 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
        position: relative;
        z-index: 1;
      }
      #message h2 {
        margin: 0 0 8px;
        font-size: 0.84rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--hailifu-orange);
      }
      #message h1 {
        margin: 0 0 14px;
        font-size: clamp(1.5rem, 3vw, 2.1rem);
        color: var(--hailifu-white);
      }
      #message p {
        margin: 0 0 14px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.82);
      }
      #message a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 6px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid var(--hailifu-orange);
        background: var(--hailifu-orange);
        color: var(--hailifu-black);
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }
      #message code { color: var(--hailifu-orange); }
      @media (max-width: 600px) {
        #message { padding: 24px 18px; }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>HAILIFU Diagnostic</h2>
      <h1>Page Not Found</h1>
      <p>The requested resource is unavailable or moved. Verify the URL and try again.</p>
      <p>If this persists, return home and retry the action.</p>
      <a href="/">Return Home</a>
    </div>
  </body>
</html>
